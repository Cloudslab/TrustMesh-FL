experiment:
  name: convergence-moderate
  description: Moderate non-IID (default)
  runs: 3  # statistical repetitions

cluster:
  iot_nodes: 5
  compute_nodes: 4

federated_learning:
  workflow_id: "357bc695-ac7c-4335-bfc4-763e53237d23"
  max_rounds: 10
  non_iid_alpha: 0.5
  total_nodes: 5
  aggregation_timeout: 180
  min_nodes_for_aggregation: 1

byzantine:
  enabled: false
  byzantine_node_count: 0
  attack_mode: none
  # Byzantine nodes are always the highest-indexed IoT nodes
  # e.g., with 5 nodes and 2 byzantine: iot-3 and iot-4 are attackers

validation:
  skip_validation: false
